[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "organizador-archivos"
version = "1.0.0"
description = "Ordena una carpeta (por ejemplo, Descargas) en subcarpetas por tipo de archivo, con simulación previa y opción de deshacer."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Pablo Sánchez Contento" }]
requires-python = ">=3.11"
dependencies = []
keywords = ["descargas", "organizar", "archivos", "cli"]
classifiers = [
    "Environment :: Console",
    "Natural Language :: Spanish",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]

[project.scripts]
organizar = "organizador.cli:main"

[project.urls]
Repositorio = "https://github.com/pablosanchezcontento-afk/organizador-archivos"

[tool.hatch.build.targets.wheel]
packages = ["src/organizador"]

[dependency-groups]
dev = ["pytest>=9,<10", "pytest-cov>=7", "ruff>=0.16", "mypy>=1.18"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=organizador --cov-report=term-missing --cov-fail-under=95"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "PTH", "RUF"]

[tool.mypy]
strict = true
files = ["src"]
